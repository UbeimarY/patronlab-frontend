<div
  #viewport
  class="viewport"
  [class.barniz]="store.document().mode === 'barniz'"
  tabindex="-1"
  role="application"
  aria-roledescription="mesa de diseño"
  [attr.aria-label]="'Mesa de diseño. ' + hint()"
  [style.cursor]="cursor()"
  (pointerdown)="onPointerDown($event)"
  (pointermove)="onPointerMove($event)"
  (pointerup)="onPointerUp($event)"
  (pointercancel)="onPointerUp($event)"
  (dblclick)="onDoubleClick($event)"
  (contextmenu)="$event.preventDefault()"
>
  <div #sheet class="sheet" [style.width.px]="sheetWidth()" [style.height.px]="sheetHeight()">
    <canvas #background class="layer"></canvas>
    <canvas #shapes class="layer"></canvas>
    <canvas #interaction class="layer"></canvas>
  </div>
  <div class="rulers" aria-hidden="true">
    <canvas #rulerX class="ruler ruler--x"></canvas>
    <canvas #rulerY class="ruler ruler--y"></canvas>
    <span class="ruler-corner">mm</span>
  </div>
  <p class="hint">{{ hint() }}</p>

  @if (knifePoints().length >= 3) {
    <button
      class="btn small primary close-knife"
      type="button"
      (pointerdown)="$event.stopPropagation()"
      (click)="finishKnifePath()"
    >
      Cerrar corte ({{ knifePoints().length }} puntos)
    </button>
  }

  @if (showMinimap()) {
    <div
      class="minimap"
      (pointerdown)="$event.stopPropagation()"
      title="Minimapa del diseño (clic para centrar y ajustar)"
      (click)="fit()"
    >
      <canvas #minimap width="136" height="136" aria-label="Minimapa del diseño"></canvas>
    </div>
  }
</div>
